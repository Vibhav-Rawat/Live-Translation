[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "livetranslate"
version = "0.1.0"
description = "Real-time speech translation straight into your earbuds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13",
    "sounddevice>=0.4.6",
    "edge-tts>=6.1.9",
    "miniaudio>=1.59",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
livetranslate = "livetranslate.cli:main"

[tool.setuptools]
packages = ["livetranslate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
